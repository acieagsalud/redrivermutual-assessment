# Only claim submissions are rate limited (an empty key is not counted): 10 a minute per client IP,
# with a burst of 10 so a family filing several claims, or a retry, is never blocked.
map $request_method $claim_submit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $claim_submit_key zone=claim_submit:10m rate=10r/m;

server {
    listen 8080;
    server_tokens off;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A claim is a few KB of JSON; refuse anything far larger.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # Same origin for the browser: no CORS configuration needed on claims-api.
    location /api/ {
        limit_req zone=claim_submit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://claims-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
