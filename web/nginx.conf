server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A claim is a few KB of JSON; refuse anything far larger.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

    # Same origin for the browser: no CORS configuration needed on claims-api.
    location /api/ {
        proxy_pass http://claims-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
