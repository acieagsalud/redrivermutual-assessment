# Alert rules, evaluated by Prometheus and listed at http://localhost:9090/alerts.
# Locally they only show there; production would route them through Alertmanager to on-call.
groups:
  - name: claim-portal
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} has not answered a scrape for 1 minute"

      - alert: OutboxBacklog
        expr: outbox_pending > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} claim events waiting for RabbitMQ; confirmation emails are delayed"

      # A 1-minute rate, so the alert clears about a minute after the broker recovers.
      - alert: OutboxPublishFailing
        expr: rate(outbox_publish_failures_total[1m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The outbox relay has been failing to publish for 2 minutes; check RabbitMQ"

      - alert: ApiServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="claims-api", uri="/api/v1/claims", status=~"5.."}[1m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Claim submissions have been returning 5xx errors for 2 minutes"

      - alert: UnusualSubmissionRate
        expr: sum(rate(http_server_requests_seconds_count{job="claims-api", uri="/api/v1/claims"}[5m])) * 60 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 30 claim requests a minute for 5 minutes; possible abuse"
